<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "IA - Dashboard" }}</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #eef2f7;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: #ffffff;
      --surface-alt: #f7f9fc;
      --ink: #16202f;
      --muted: #617089;
      --line: rgba(22, 32, 47, 0.1);
      --accent: #2f6fed;
      --accent-strong: #1f53c6;
      --accent-soft: rgba(47, 111, 237, 0.1);
      --success: #1f8f61;
      --warning: #c57a18;
      --error: #cb3d4f;
      --shadow: 0 18px 44px rgba(47, 71, 119, 0.14);
      --shadow-soft: 0 8px 20px rgba(47, 71, 119, 0.08);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --max-width: 1240px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(47, 111, 237, 0.18), transparent 34%),
        radial-gradient(circle at top right, rgba(134, 197, 255, 0.24), transparent 26%),
        linear-gradient(180deg, #eef3fb 0%, #edf2f8 48%, #e9eef5 100%);
      font-family: "Segoe UI", "Roboto", Tahoma, sans-serif;
      font-size: 0.8rem;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(22, 32, 47, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 32, 47, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent 85%);
    }

    .shell {
      width: min(var(--max-width), calc(100vw - 32px));
      margin: 18px auto 40px;
      padding-bottom: 112px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 22px;
      padding: 11px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 14px;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent) 0%, #60a5fa 100%);
      color: #f8fbff;
      font-weight: 700;
      letter-spacing: 0.08em;
      box-shadow: 0 8px 18px rgba(47, 111, 237, 0.28);
    }

    .brand-copy small,
    .status-chip,
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.71rem;
    }

    .brand-copy strong {
      display: block;
      font-size: 0.88rem;
    }

    .brand-copy small,
    .muted,
    .helper {
      color: var(--muted);
    }

    .field-help {
      margin-top: -2px;
      margin-bottom: 2px;
      color: #7a8599;
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.76), transparent 30%),
        linear-gradient(135deg, #23408f 0%, #2f6fed 46%, #6aa3ff 100%);
      color: #f8fbff;
      padding: 28px 26px 24px;
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -30% 40%;
      height: 280px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 62%);
      transform: rotate(-6deg);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.9fr);
      gap: 28px;
      align-items: end;
    }

    .hero h1 {
      margin: 10px 0 12px;
      font-size: clamp(2rem, 4vw, 3.9rem);
      line-height: 0.95;
      max-width: 8ch;
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      max-width: 56ch;
      color: rgba(248, 251, 255, 0.82);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    .hero-meta,
    .panel,
    .metric-card,
    .subpanel {
      background: var(--surface);
      border: 1px solid rgba(29, 43, 36, 0.08);
      border-radius: var(--radius-lg);
    }

    .hero-meta {
      display: grid;
      gap: 12px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
    }

    .hero-meta strong {
      display: block;
      margin-top: 4px;
      font-size: 1rem;
    }

    .hero-meta span {
      color: rgba(248, 251, 255, 0.74);
      font-size: 0.92rem;
    }

    .content { margin-top: 18px; }

    .panel {
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }

    .panel-section {
      padding: 19px;
    }

    .panel-section + .panel-section {
      border-top: 1px solid var(--line);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      padding: 0;
      margin: 0;
      border-radius: 14px;
      background: transparent;
      border: 0;
      backdrop-filter: none;
      box-shadow: none;
    }

    .tab-btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.15;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      background: rgba(29, 43, 36, 0.04);
      color: var(--ink);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #f8fbff;
      box-shadow: 0 10px 22px rgba(47, 111, 237, 0.24);
    }

    .subtabs {
      display: inline-grid;
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 8px;
      padding: 6px;
      border-radius: 14px;
      background: rgba(47, 111, 237, 0.06);
      border: 1px solid rgba(47, 111, 237, 0.1);
    }

    .subtab-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      box-shadow: none;
      min-height: 0;
    }

    .subtab-btn:hover {
      transform: none;
      box-shadow: none;
      background: rgba(47, 111, 237, 0.08);
      color: var(--ink);
    }

    .subtab-btn.active {
      background: #ffffff;
      color: var(--accent-strong);
      box-shadow: var(--shadow-soft);
    }

    .form-stack {
      display: grid;
      gap: 10px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 10px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .section-head h2,
    .section-head h3 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }

    .section-head p,
    .subpanel p,
    .helper {
      margin: 6px 0 0;
      line-height: 1.6;
    }

    .metric-grid,
    .grid-2 {
      display: grid;
      gap: 14px;
    }

    .metric-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card,
    .subpanel {
      padding: 15px;
      background: var(--surface-strong);
      box-shadow: 0 1px 0 rgba(255,255,255,0.7), var(--shadow-soft);
    }

    .metric-card strong {
      display: block;
      margin-top: 10px;
      font-size: 1.6rem;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .phase-shell {
      display: grid;
      gap: 14px;
    }

    .phase-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 14px;
      align-items: stretch;
    }

    .phase-progress-card {
      padding: 18px;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(47, 111, 237, 0.1), rgba(96, 165, 250, 0.06)),
        var(--surface-strong);
      border: 1px solid rgba(47, 111, 237, 0.12);
      box-shadow: var(--shadow-soft);
    }

    .phase-progress-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .phase-progress-head h3,
    .phase-progress-card h4 {
      margin: 0;
    }

    .phase-progress-head p,
    .phase-progress-card p {
      margin: 6px 0 0;
    }

    .phase-status-pill {
      padding: 8px 11px;
      border-radius: 10px;
      background: rgba(47, 111, 237, 0.1);
      color: var(--accent-strong);
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .phase-bar-track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(22, 32, 47, 0.08);
      margin: 14px 0 12px;
    }

    .phase-bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f6fed 0%, #60a5fa 100%);
      transition: width 240ms ease;
    }

    .phase-stage-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .phase-stage-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(22, 32, 47, 0.06);
    }

    .phase-stage-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(22, 32, 47, 0.18);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.72);
    }

    .phase-stage-item.active {
      border-color: rgba(47, 111, 237, 0.2);
      background: rgba(47, 111, 237, 0.08);
    }

    .phase-stage-item.active .phase-stage-dot {
      background: #2f6fed;
    }

    .phase-stage-item.done .phase-stage-dot {
      background: #1f8f61;
    }

    .phase-stage-label {
      font-weight: 700;
      color: var(--ink);
    }

    .phase-stage-state {
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .phase-kpi {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .phase-mini {
      padding: 16px;
      border-radius: 18px;
      background: var(--surface-strong);
      border: 1px solid rgba(22, 32, 47, 0.06);
      box-shadow: var(--shadow-soft);
    }

    .phase-mini strong {
      display: block;
      margin-top: 8px;
      font-size: 1.35rem;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .phase-plain-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .phase-plain-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(22, 32, 47, 0.08);
    }

    .phase-plain-list li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .phase-empty {
      padding: 18px;
      border-radius: 18px;
      border: 1px dashed rgba(22, 32, 47, 0.16);
      background: rgba(255, 255, 255, 0.52);
      color: var(--muted);
    }

    .mono-inline {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.77rem;
      color: var(--muted);
      word-break: break-all;
    }

    .subpanel h3,
    .subpanel h4 {
      margin: 0 0 8px;
      letter-spacing: -0.03em;
      font-size: 1rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(29, 43, 36, 0.12);
      border-radius: 12px;
      background: rgba(249, 251, 255, 0.96);
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(47, 111, 237, 0.42);
      box-shadow: 0 0 0 5px rgba(47, 111, 237, 0.08);
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
      accent-color: var(--accent);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 0.95rem;
      margin: 6px 0 12px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #f8fbff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 12px 22px rgba(47, 111, 237, 0.24);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(47, 111, 237, 0.28);
    }

    button.secondary {
      background: rgba(47, 111, 237, 0.08);
      color: var(--accent-strong);
      box-shadow: none;
      border: 1px solid rgba(47, 111, 237, 0.16);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(29, 43, 36, 0.08);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    textarea {
      min-height: 220px;
      background: #101827;
      color: #d9e5ff;
      font-family: Consolas, "Courier New", monospace;
      border-color: rgba(255, 255, 255, 0.08);
    }

    canvas { width: 100%; max-height: 340px; }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(47, 111, 237, 0.08);
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .error { color: var(--error); font-weight: 700; }
    .ok { color: var(--success); font-weight: 700; }

    .note-list {
      margin: 0;
      padding-left: 18px;
      line-height: 1.8;
    }

    @media (max-width: 1100px) {
      .hero-grid,
      .metric-grid,
      .grid-3,
      .phase-hero,
      .phase-kpi,
      .tabs,
      .topbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 860px) {
      .shell { width: min(var(--max-width), calc(100vw - 18px)); margin-top: 12px; }
      .topbar { border-radius: 24px; justify-items: stretch; }
      .hero { padding: 26px 20px 22px; }
      .panel-section { padding: 16px; }
      .grid-2,
      .metric-grid { grid-template-columns: 1fr; }
      .subtabs {
        grid-auto-flow: row;
        grid-auto-columns: auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell" {% block shell_attrs %}{% endblock %}>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">IA</div>
        <div class="brand-copy">
          <strong>Clasificador de Imágenes</strong>
          <small>gatos / perros / panda</small>
        </div>
      </div>
      {% block topbar_menu %}{% endblock %}
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
